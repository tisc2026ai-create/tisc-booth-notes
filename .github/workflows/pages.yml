name: Publish consultation recorder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up regression checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run regression checks
        run: npm test
      - name: Prepare public files
        run: |
          mkdir -p _site/icons
          cp index.html styles.css app.js storage.js archive.js sw.js _site/
          cp icons/icon.svg _site/icons/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
